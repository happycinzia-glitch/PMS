<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>門禁登入</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 門禁登入：通過後才看得到系統登入頁 (見 src/routes/gate.js) -->
  <div class="login-wrap">
    <form class="login-card" id="gateForm">
      <img class="logo" src="/img/logo.png" alt="公司標誌">
      <h1>門禁登入</h1>
      <div class="hint" style="text-align:center;margin:-6px 0 16px">僅限授權人員使用</div>
      <div class="field">
        <label for="gate_id">門禁帳號</label>
        <input type="text" id="gate_id" autocomplete="username" autocapitalize="off" required>
      </div>
      <div class="field">
        <label for="password">門禁密碼</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn block" id="gateBtn">進入</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('gateForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('gateBtn');

    // 已通過門禁 (或門禁未開啟) 直接前往系統登入頁
    fetch('/api/gate/status').then(r => r.json()).then(s => { if (s.passed) location.href = '/'; });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg'; msg.textContent = '';
      btn.disabled = true; btn.textContent = '驗證中...';
      try {
        const res = await fetch('/api/gate/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            gate_id: document.getElementById('gate_id').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (res.ok) {
          location.href = '/';
        } else {
          msg.className = 'msg error';
          msg.textContent = data.error || '門禁登入失敗。';
        }
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = '無法連線伺服器，請稍後再試。';
      } finally {
        btn.disabled = false; btn.textContent = '進入';
      }
    });
  </script>
</body>
</html>
